name: Update Statbotics data
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["data/events.txt"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install statbotics
      - run: python scripts/fetch_statbotics.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/statbotics
          git diff --cached --quiet || (git commit -m "Update Statbotics data" && git push)
